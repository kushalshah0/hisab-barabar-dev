version: 2.1

executors:
  android:
    docker:
      - image: cimg/android:2024.01-node
    resource_class: large
    environment:
      APP_DIR: mobile-app

commands:
  setup-android:
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: cd $APP_DIR && npm ci
      - run:
          name: Prebuild
          command: cd $APP_DIR && npx expo prebuild --platform android --no-install
      - run:
          name: Set SDK path
          command: echo "sdk.dir=$ANDROID_HOME" > $APP_DIR/android/local.properties
      - run:
          name: Tune Gradle memory
          command: |
            echo "" >> $APP_DIR/android/gradle.properties
            cat >> $APP_DIR/android/gradle.properties <<'EOF'
            org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
            org.gradle.daemon=false
            org.gradle.parallel=false
            org.gradle.workers.max=2
            kotlin.compiler.execution.strategy=in-process
            reactNativeArchitectures=arm64-v8a
            EOF

jobs:
  build-dev:
    executor: android
    steps:
      - setup-android
      - run:
          name: Build dev APK
          command: cd $APP_DIR/android && ./gradlew assembleDebug
      - store_artifacts:
          path: mobile-app/android/app/build/outputs/apk/debug
          destination: dev-apk

  build-release:
    executor: android
    steps:
      - setup-android
      - run:
          name: Build release APK
          environment:
            NODE_ENV: production
          command: cd $APP_DIR/android && ./gradlew assembleRelease
      - store_artifacts:
          path: mobile-app/android/app/build/outputs/apk/release
          destination: release-apk

workflows:
  build:
    jobs:
      - build-dev
      - build-release
